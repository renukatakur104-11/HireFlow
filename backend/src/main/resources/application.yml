server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hireflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hireflow_db?sslMode=PREFERRED&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HireFlowHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      keepalive-time: 60000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_RESUME_SIZE_MB:5}MB
      max-request-size: ${MAX_RESUME_SIZE_MB:5}MB

# Custom HireFlow Application Properties
hireflow:
  jwt:
    secret: ${JWT_SECRET:changeThisDefaultSecretKeyToSomethingVerySecureAndLongEnoughForHmacSha256!}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000}       # 15 minutes
    refresh-token-expiration-ms: ${REFRESH_EXPIRATION_MS:604800000} # 7 days
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads/resumes}
  bootstrap:
    admin:
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@hireflow.edu}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:AdminSecurePassword123!}
  ai:
    provider: ${AI_PROVIDER:GEMINI}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-1.5-flash}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
