version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-900000}
      - REFRESH_EXPIRATION_MS=${REFRESH_EXPIRATION_MS:-604800000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
      - UPLOAD_DIR=/app/uploads/resumes
      - MAX_RESUME_SIZE_MB=${MAX_RESUME_SIZE_MB:-5}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-GEMINI}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-admin@hireflow.edu}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-AdminSecurePassword123!}
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - resume-storage:/app/uploads/resumes

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: hireflow-frontend
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # -------------------------------------------------------------
  # OPTIONAL OFFLINE FALLBACK ONLY:
  # The primary database is Aiven Cloud MySQL (configured via DB_URL).
  # This container will NOT run by default unless explicitly activated via:
  # docker-compose --profile local-db up
  # -------------------------------------------------------------
  mysql-local-optional:
    image: mysql:8.0
    container_name: hireflow-mysql-local-optional
    profiles: ["local-db"]
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-devpassword}
      MYSQL_DATABASE: hireflow_db
    ports:
      - "3307:3306"

volumes:
  resume-storage:
