version: '3.8'

services:
  mysql-dev:
    image: mysql:8.0
    container_name: hireflow-mysql-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: hireflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-dev-data:
